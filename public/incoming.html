<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AES Logistics - Incoming Inventory</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f7fa;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    header p {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .content {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input[type="text"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    input[type="file"]:focus,
    textarea:focus {
      outline: none;
      border-color: #2c3e50;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .file-name {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
      font-style: italic;
    }

    .info-box {
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 12px;
      margin: 15px 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .info-box.success {
      background: #f0f7f4;
      border-color: #10b981;
      color: #065f46;
    }

    .info-box.error {
      background: #fef2f2;
      border-color: #ef4444;
      color: #7f1d1d;
    }

    .info-box.loading {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #1e40af;
    }

    .info-item {
      margin: 8px 0;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .info-label {
      font-weight: 600;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #2c3e50;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    button:hover:not(:disabled) {
      background: #1a252f;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .button-group button {
      flex: 1;
      margin-top: 0;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #f0f0f0;
      border-top: 2px solid #2c3e50;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .step {
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e0e0e0;
    }

    .step:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .step-title {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    footer {
      padding: 15px 30px;
      background: #f9f9f9;
      font-size: 12px;
      color: #666;
      text-align: center;
      border-top: 1px solid #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📦 AES Logistics</h1>
      <p>Incoming Inventory</p>
    </header>

    <div class="content">
      <!-- Step 1: Upload Photo -->
      <div class="step">
        <div class="step-title">Step 1: Capture Photo</div>
        <div class="form-group">
          <label for="photoInput">Select Packing Slip Image</label>
          <input type="file" id="photoInput" accept="image/*" required>
          <div class="file-name" id="fileName"></div>
        </div>
        <button type="button" id="extractBtn">Extract PO Number</button>
        <div class="info-box" id="extractResult" style="display:none;"></div>
      </div>

      <!-- Step 2: Verify PO and Get Project Name -->
      <div class="step">
        <div class="step-title">Step 2: Verify Details</div>

        <div class="form-group">
          <label for="projectNumber">Project Number</label>
          <input type="text" id="projectNumber" placeholder="e.g., 25066">
        </div>

        <div class="form-group">
          <label for="poSuffix">PO Suffix</label>
          <input type="text" id="poSuffix" placeholder="e.g., 99">
        </div>

        <div class="form-group">
          <label for="projectName">Project Name</label>
          <input type="text" id="projectName" placeholder="Looking up...">
        </div>

        <button type="button" id="lookupBtn" disabled>Lookup Project Name</button>
        <div class="info-box" id="lookupResult" style="display:none;"></div>
      </div>

      <!-- Step 3: Upload -->
      <div class="step">
        <div class="step-title">Step 3: Notes (Optional)</div>
        <div class="form-group">
          <label for="notes">Any Special Instructions</label>
          <textarea id="notes" placeholder="e.g., Fragile items, handle with care"></textarea>
        </div>

        <button type="button" id="uploadBtn" disabled>Upload Packing Slip</button>
        <div class="info-box" id="uploadResult" style="display:none;"></div>
      </div>

      <div class="button-group">
        <button type="button" id="resetBtn">Reset</button>
      </div>
    </div>

    <footer>
      AES Logistics Express v2.0
    </footer>
  </div>

  <script>
    const photoInput = document.getElementById('photoInput');
    const fileName = document.getElementById('fileName');
    const extractBtn = document.getElementById('extractBtn');
    const projectNumber = document.getElementById('projectNumber');
    const poSuffix = document.getElementById('poSuffix');
    const projectName = document.getElementById('projectName');
    const lookupBtn = document.getElementById('lookupBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const resetBtn = document.getElementById('resetBtn');

    let photoFile = null;

    const API_BASE = '';

    // File selection
    photoInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        photoFile = e.target.files[0];
        fileName.textContent = `Selected: ${photoFile.name}`;
        extractBtn.disabled = false;
      }
    });

    // Enable lookup when project number is filled
    projectNumber.addEventListener('input', () => {
      lookupBtn.disabled = !projectNumber.value;
      checkUploadReady();
    });

    // Enable upload when both project number and po suffix are filled
    poSuffix.addEventListener('input', () => {
      checkUploadReady();
    });

    function checkUploadReady() {
      uploadBtn.disabled = !projectNumber.value || !poSuffix.value;
    }

    // Extract PO from image
    extractBtn.addEventListener('click', async () => {
      if (!photoFile) return;

      const formData = new FormData();
      formData.append('photo', photoFile);

      extractBtn.disabled = true;
      extractBtn.innerHTML = '<span class="spinner"></span>Extracting...';
      const result = document.getElementById('extractResult');
      result.style.display = 'none';

      try {
        const response = await fetch(`${API_BASE}/api/extract-po`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok && data.success) {
          projectNumber.value = data.projectNumber || '';
          poSuffix.value = data.poSuffix || '';
          projectName.value = '';
          lookupBtn.disabled = !projectNumber.value;

          showInfo(result, 'success', `✓ PO Extracted: ${data.fullPO || 'N/A'}`);
        } else {
          showInfo(result, 'error', `✗ ${data.message || 'Could not extract PO'}`);
        }
      } catch (error) {
        showInfo(result, 'error', `✗ Error: ${error.message}`);
      } finally {
        extractBtn.disabled = false;
        extractBtn.innerHTML = 'Extract PO Number';
      }
    });

    // Lookup project name
    lookupBtn.addEventListener('click', async () => {
      if (!projectNumber.value) return;

      lookupBtn.disabled = true;
      lookupBtn.innerHTML = '<span class="spinner"></span>Looking up...';
      const result = document.getElementById('lookupResult');
      result.style.display = 'none';

      try {
        const response = await fetch(`${API_BASE}/api/project-name/${projectNumber.value}`);
        const data = await response.json();

        if (response.ok) {
          projectName.value = data.projectName || '';
          showInfo(result, 'success', `✓ Project: ${data.projectName}`);
        } else {
          showInfo(result, 'error', `✗ ${data.error || 'Project not found'}`);
        }
      } catch (error) {
        showInfo(result, 'error', `✗ Error: ${error.message}`);
      } finally {
        lookupBtn.disabled = false;
        lookupBtn.innerHTML = 'Lookup Project Name';
        uploadBtn.disabled = false;
      }
    });

    // Upload
    uploadBtn.addEventListener('click', async () => {
      if (!projectNumber.value || !poSuffix.value) {
        alert('Please enter Project Number and PO Suffix');
        return;
      }

      if (!photoFile) {
        alert('Please select a photo');
        return;
      }

      const formData = new FormData();
      formData.append('file', photoFile);
      formData.append('projectNumber', projectNumber.value);
      formData.append('poSuffix', poSuffix.value);
      formData.append('projectName', projectName.value || '');

      uploadBtn.disabled = true;
      uploadBtn.innerHTML = '<span class="spinner"></span>Uploading...';
      const result = document.getElementById('uploadResult');
      result.style.display = 'none';

      try {
        const response = await fetch(`${API_BASE}/api/upload`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          showInfo(result, 'success', `
            <div class="info-item"><span class="info-label">✓ Uploaded Successfully</span></div>
            <div class="info-item"><span class="info-label">File:</span> ${data.filename}</div>
            <div class="info-item"><span class="info-label">PO:</span> ${data.poNumber}</div>
          `);

          // Reset after 2 seconds
          setTimeout(() => {
            document.getElementById('resetBtn').click();
          }, 2000);
        } else {
          showInfo(result, 'error', `✗ ${data.error}: ${data.details || ''}`);
        }
      } catch (error) {
        showInfo(result, 'error', `✗ Error: ${error.message}`);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerHTML = 'Upload Packing Slip';
      }
    });

    // Reset form
    resetBtn.addEventListener('click', () => {
      photoInput.value = '';
      fileName.textContent = '';
      projectNumber.value = '';
      poSuffix.value = '';
      projectName.value = '';
      document.getElementById('notes').value = '';
      photoFile = null;

      extractBtn.disabled = true;
      lookupBtn.disabled = true;
      checkUploadReady();

      document.getElementById('extractResult').style.display = 'none';
      document.getElementById('lookupResult').style.display = 'none';
      document.getElementById('uploadResult').style.display = 'none';
    });

    function showInfo(element, type, message) {
      element.className = `info-box ${type}`;
      element.innerHTML = message;
      element.style.display = 'block';
    }
  </script>
</body>
</html>
